name: DatePickerRepro
options:
  bundleIdPrefix: dev.repro
  deploymentTarget:
    iOS: "17.0"
targets:
  DatePickerRepro:
    type: application
    platform: iOS
    sources: [DatePickerRepro]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.repro.DatePickerRepro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
